<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programmer Humour</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    img { max-width: 600px; width: 100%; margin-top: 1rem; }
    #error { color: red; }
  </style>
</head>
<body>
  <h1>Programmer Humour</h1>
  <div id="comic"></div>
  <p id="error"></p>

  <script>
    fetch("https://xkcd.now.sh/?comic=latest")
      .then(function (response) {
        if (!response.ok) throw new Error("Network response was not ok");
        return response.json();
      })
      .then(function (data) {
        console.log(data);
        const img = document.createElement("img");
        img.src = data.img;
        img.alt = data.title;
        document.getElementById("comic").appendChild(img);
      })
      .catch(function (error) {
        document.getElementById("error").textContent = "Failed to load comic: " + error.message;
      });
  </script>
</body>
</html>
