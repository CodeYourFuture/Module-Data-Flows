<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library App</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <!-- Refactor: Loaded script as an ES Module to isolate scope from global context -->
    <script src="script.js" type="module"></script>
  </head>

  <body>
    <div class="jumbotron text-center">
      <h1>Library</h1>
      <p>Add books to your virtual library</p>
    </div>

    <button data-toggle="collapse" data-target="#demo" class="btn btn-info">
      Add new book
    </button>

    <div id="demo" class="collapse">
      <!-- Refactor: Form wrapped to allow formal submit handling and native constraint execution -->
      <form id="book-form">
        <div class="form-group">
          <label for="title">Title:</label>
          <!-- Refactor: Enforced baseline input validation attributes -->
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            required
            placeholder="Enter book title..."
          />
          
          <label for="author">Author: </label>
          <input
            type="text"
            class="form-control"
            id="author"
            name="author"
            required
            placeholder="Enter author name..."
          />
          
          <label for="pages">Pages:</label>
          <input
            type="number"
            min="1"
            class="form-control"
            id="pages"
            name="pages"
            required
            placeholder="Enter total pages..."
          />
          
          <div class="form-check my-2">
            <label class="form-check-label" for="check">
              <input
                type="checkbox"
                class="form-check-input"
                id="check"
              />Read
            </label>
          </div>
          
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>

    <table class="table" id="display">
      <thead class="thead-dark">
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Number of Pages</th>
          <th>Read</th>
          <th>Actions</th>
        </tr>
      </thead>
      <!-- Refactor: Fixed empty row placeholder syntax error to ensure true W3C compliance -->
      <tbody id="book-table-body">
        <!-- Table rows dynamically generated by script.js -->
      </tbody>
    </table>
  </body>
</html>
