<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Library</title>

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="style.css" />

  <!-- JS Dependencies -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
</head>

<body>
  <div class="container my-4">
    <div class="jumbotron text-center">
      <h1>Library</h1>
      <p>Add books to your virtual library</p>
    </div>

    <button data-toggle="collapse" data-target="#demo" class="btn btn-info mb-3">
      Add new book
    </button>

    <div id="demo" class="collapse">
      <!-- Wrapped in a form, calls addBook(event) instead of reserved submit() -->
      <form onsubmit="addBook(event)">
        <div class="form-group mb-2">
          <label for="title" class="mb-1">Title:</label>
          <input type="text" class="form-control" id="title" name="title" required />
        </div>

        <div class="form-group mb-2">
          <label for="author" class="mb-1">Author:</label>
          <input type="text" class="form-control" id="author" name="author" required />
        </div>

        <div class="form-group mb-2">
          <label for="pages" class="mb-1">Pages:</label>
          <input type="number" class="form-control" id="pages" name="pages" required />
        </div>

        <div class="form-group form-check my-2">
          <input type="checkbox" class="form-check-input" id="check" />
          <label class="form-check-label" for="check">Read</label>
        </div>

        <button type="submit" class="btn btn-primary mt-2">Submit</button>
      </form>
    </div>

    <table class="table" id="display">
      <thead class="thead-dark">
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>Number of Pages</th>
          <th>Read</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="book-list">
        <!-- JS will populate rows here -->
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>

</html>
