<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dog Photo Gallery</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
    li img { width: 200px; height: 200px; object-fit: cover; border-radius: 8px; }
    #error { color: red; }
  </style>
</head>
<body>
  <h1>Dog Photo Gallery</h1>
  <button id="fetch-btn">Fetch a Dog!</button>
  <button id="clear-btn">Clear</button>
  <p id="error"></p>
  <ul id="gallery"></ul>

  <script>
    document.getElementById("fetch-btn").addEventListener("click", function () {
      document.getElementById("error").textContent = "";
      fetch("https://dog.ceo/api/breeds/image/random")
        .then(function (response) {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then(function (data) {
          const li = document.createElement("li");
          const img = document.createElement("img");
          img.src = data.message;
          img.alt = "A random dog";
          li.appendChild(img);
          document.getElementById("gallery").appendChild(li);
        })
        .catch(function (error) {
          document.getElementById("error").textContent = "Failed to fetch dog: " + error.message;
        });
    });

    document.getElementById("clear-btn").addEventListener("click", function () {
      document.getElementById("gallery").innerHTML = "";
    });
  </script>
</body>
</html>
