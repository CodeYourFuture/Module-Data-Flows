<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>Meteoropolis</title>
  <link rel="stylesheet" href="assets/globals.css">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
  <!-- Structure -->
  <main class="content">
    <header class="header">
      <h1 class="title">
        <i>Meteor</i>
        <i>opolis</i>
      </h1>
    </header>

    <figure class="photo" id="photo"></figure>

    <div class="info">
      <p class="info__item info__item--conditions" id="conditions"></p>
      <p class="info__item info__item--credits">
        <a href="#" id="credit-user"></a>
        <span>on</span>
        <a href="#" id="credit-platform">Unsplash</a>
      </p>
    </div>

    <div class="thumbs" id="thumbs"></div>

    <div class="controls">
      <form class="search" id="search">
        <label class="search__label" for="search-tf">City</label>
        <input class="search__input" id="search-tf" name="city" placeholder="Enter city name" autocomplete="city" />
        <button class="btn search__btn">Go</button>
      </form>
    </div>
  </main>

  <!-- JS goes here -->
  <script>
    const WEATHER_API_KEY = "YOUR_OPENWEATHER_API_KEY";
    const UNSPLASH_API_KEY = "YOUR_UNSPLASH_ACCESS_KEY";

    function fetchWeather(city) {
      return fetch(
        `https://api.openweathermap.org/data/2.5/weather?q=${city}&APPID=${WEATHER_API_KEY}`
      ).then(function (res) {
        if (!res.ok) throw new Error("City not found");
        return res.json();
      });
    }

    function fetchPhotos(query) {
      return fetch(
        `https://api.unsplash.com/search/photos?query=${query}&client_id=${UNSPLASH_API_KEY}`
      ).then(function (res) {
        if (!res.ok) throw new Error("Failed to fetch photos");
        return res.json();
      });
    }

    function renderGallery(photos) {
      const thumbs = document.getElementById("thumbs");
      const photo = document.getElementById("photo");
      thumbs.innerHTML = "";
      photo.innerHTML = "";

      if (!photos.length) return;

      function showMain(p) {
        photo.innerHTML = `<img src="${p.urls.regular}" alt="${p.alt_description || ""}" />`;
        document.getElementById("credit-user").textContent = p.user.name;
        document.getElementById("credit-user").href = p.user.links.html;
        document.querySelectorAll(".thumb").forEach((t) => t.classList.remove("active"));
        document.querySelector(`[data-id="${p.id}"]`).classList.add("active");
      }

      showMain(photos[0]);

      photos.forEach(function (p) {
        const img = document.createElement("img");
        img.src = p.urls.thumb;
        img.alt = p.alt_description || "";
        img.className = "thumb";
        img.dataset.id = p.id;
        img.addEventListener("click", function () { showMain(p); });
        thumbs.appendChild(img);
      });

      document.querySelector(`[data-id="${photos[0].id}"]`).classList.add("active");
    }

    function loadCity(city) {
      fetchWeather(city)
        .then(function (weather) {
          const description = weather.weather[0].description;
          document.getElementById("conditions").textContent = description;
          return fetchPhotos(description);
        })
        .then(function (data) {
          renderGallery(data.results);
        })
        .catch(function (err) {
          alert(err.message);
        });
    }

    document.getElementById("search").addEventListener("submit", function (e) {
      e.preventDefault();
      const city = document.getElementById("search-tf").value.trim();
      if (city) loadCity(city);
    });

    loadCity("London");
  </script>
</body>

</html>
